name: Build and publish unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        required: true
        default: v1.10.16
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build unsigned IPA
        run: pnpm build:ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            ios/build/unsigned/Moumusic-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Moumusic $RELEASE_TAG" \
            --notes "Automated unsigned iOS IPA build. This artifact must be signed before it can be installed on an iPhone." \
            --latest
