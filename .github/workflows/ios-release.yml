name: Build and publish unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        required: true
        default: v1.10.19
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build unsigned IPA
        run: pnpm build:ipa

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Moumusic $RELEASE_TAG" \
              --notes "Automated unsigned mobile build. Artifacts must be signed before installation." \
              --latest
          fi

      - name: Publish IPA to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            ios/build/unsigned/Moumusic-unsigned.ipa#Moumusic-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
