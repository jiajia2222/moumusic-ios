name: Build and publish unsigned Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload
        required: true
        default: v1.10.18
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install pnpm
        run: npm install --global pnpm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned release APK
        run: pnpm build:apk release

      - name: Verify APK metadata
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            APK_PATH=android/app/build/outputs/apk/release/app-release.apk
          else
            test -f android/app/build/outputs/apk/release/app-release-unsigned.apk
            APK_PATH=android/app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          sha256sum "$APK_PATH"

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Moumusic $RELEASE_TAG" \
              --notes "Automated unsigned Android APK build. This artifact must be signed before installation." \
              --latest
          fi

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$APK_PATH#Moumusic-release-unsigned.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
